version: '3.8'

services:
  # 서비스 마스터 DB (MariaDB)
  service-db:
    image: mariadb:10.11
    container_name: service-db
    ports:
      - "3307:3306"
    environment:
      MARIADB_ROOT_PASSWORD: password
      MARIADB_DATABASE: service_db
      MARIADB_ROOT_HOST: '%'
    volumes:
      - service_mysql_data:/var/lib/mysql

  # 분석용 DB (MariaDB)
  analysis-db:
    image: mariadb:10.11
    container_name: analysis-db
    ports:
      - "3308:3306"
    environment:
      MARIADB_ROOT_PASSWORD: password
      MARIADB_DATABASE: analysis_db
      MARIADB_ROOT_HOST: '%'
    volumes:
      - analysis_mysql_data:/var/lib/mysql

  redis:
    image: redis:latest
    container_name: pipeline-redis
    ports:
      - "6380:6379"
    command: ["redis-server", "--appendonly", "yes"]

  app-producer:
    build:
      context: .
      dockerfile: producer/Dockerfile
    container_name: producer-app
    depends_on:
      - redis
    environment:
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379

  app-consumer:
    build:
      context: .
      dockerfile: consumer/Dockerfile
    container_name: consumer-app
    depends_on:
      - service-db
      - analysis-db
      - redis
    restart: always
    environment:
      SERVICE_DB_HOST: service-db
      SERVICE_DB_PORT: 3306
      ANALYSIS_DB_HOST: analysis-db
      ANALYSIS_DB_PORT: 3306
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379

  # 분석 대시보드 (Streamlit)
  app-analytics:
    build:
      context: ./analysis
    container_name: analytics-app
    ports:
      - "8501:8501"
    depends_on:
      - analysis-db
    environment:
      ANALYSIS_DB_HOST: analysis-db
      ANALYSIS_DB_PORT: 3306

volumes:
  service_mysql_data:
  analysis_mysql_data:
